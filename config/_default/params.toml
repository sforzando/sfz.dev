# -- Theme Options --
# These options control how the theme functions and allow you to
# customize the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultThemeColor = "#1e293b"
defaultAppearance = "dark" # valid options: light or dark
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = false
enableImageLazyLoading = true
enableImageWebp = true
enableQuicklink = true

# logo = "img/logo/800x800_ffffff.png"
mainSections = ["posts"]
# robots = ""

[homepage]
  layout = "page" # valid options: page, profile, custom
  showRecent = true

[header]
  layout = "hybrid" # valid options: basic, hamburger, hybrid, custom
  logo = "img/logo/800x800_ffffff.png"
  showTitle = false

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = false
  showScrollToTop = true

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  # editURL = "https://github.com/username/repo/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showComments = false
  sharingLinks = ["facebook", "twitter", "pinterest", "reddit", "linkedin", "email"]

[list]
  showBreadcrumbs = false
  showSummary = false
  showTableOfContents = false
  groupByYear = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true

[fathomAnalytics]
  site = "NDBFFLKC"

# Clarity treats the project ID as the client API key and expects it in plain
# markup, so it is committed here rather than injected via getenv.
[clarityAnalytics]
  projectId = "9a6aus6eoq"

[verification]
  # google = ""
  # bing = ""
  # pinterest = ""
  # yandex = ""


[teams]
  # Set to false when not hiring to hide the recruitment banner
  showRecruitmentBanner = true

[tagCloud]
  # Tags always placed near the center regardless of article count (case-insensitive)
  pinnedCenterTags = ["announcement", "tech"]
