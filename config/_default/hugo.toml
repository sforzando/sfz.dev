# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://sfz.dev/"
defaultContentLanguage = "en"
theme = "congo"

enableRobotsTXT = true
googleAnalytics = "G-L2MP8FTCW6"

hasCJKLanguage = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[security.funcs]
  getenv = ["^HUGO_", "^MAPBOX"]

[module]
  # hugoVersion lives in module.toml, not here. Files in this directory merge
  # under a key taken from their basename, so module.toml's [hugoVersion] lands
  # on module.hugoVersion and, being read later, wins over anything set here.
  #
  # mapbox-gl is loaded as a prebuilt bundle by the mapboxGl shortcode, so its
  # dist has to be reachable from assets. three needs no such mount: it is
  # imported from node_modules and bundled by js.Build.
  [[module.mounts]]
    source = "node_modules/mapbox-gl/dist"
    target = "assets/vendor/mapbox-gl"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
