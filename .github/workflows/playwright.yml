name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.168.0'
        extended: true
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".node-version"
        cache: "npm"
    - name: Install Dependencies
      run: task install:ci
    # Hugo's js.Build and Playwright both strip types without checking them,
    # so this is the only gate that keeps type errors out of main.
    # Placed before Playwright so a type error fails in seconds, not minutes.
    - name: Typecheck
      run: task typecheck
    - name: Lint
      run: task lint:biome
    - name: Run Playwright tests
      run: task test:ci
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
