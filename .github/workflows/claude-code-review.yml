name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Pass the full URL. The plugin feeds this straight to `gh pr view`,
          # which only understands a number, a full URL or a branch name -- the
          # old owner/repo/pull/N string was read as a branch and failed with
          # "no pull requests found for branch", so the plugin could not tell
          # whether it had already reviewed the PR and stopped at its first step.
          prompt: '/code-review:code-review ${{ github.event.pull_request.html_url }} --comment'
          display_report: true
          use_sticky_comment: true
          # Because the PR head is untrusted, the action restores .claude/ from the
          # base branch, so this repository's settings.local.json allow list governs
          # the run, and anything missing from it is refused.
          #
          # Skill is what actually blocked this for three runs: the prompt below is
          # a slash command, so Claude reaches for the Skill tool to start the
          # plugin and was refused before running a single step. It then improvised
          # its own agents and finished without commenting. Only the code-review
          # plugin is installed here, so allowing Skill grants nothing else.
          #
          # The gh entries mirror the plugin's allowed-tools frontmatter. The rest
          # cover what its subagents need but the frontmatter does not declare: the
          # step that locates the relevant CLAUDE.md files, and the reviewers that
          # read them and the surrounding diff.
          # https://github.com/anthropics/claude-code/blob/main/plugins/code-review/commands/code-review.md
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh issue list:*)",
                  "Bash(gh issue view:*)",
                  "Bash(gh pr comment:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh pr list:*)",
                  "Bash(gh pr view:*)",
                  "Bash(gh search:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Glob",
                  "Grep",
                  "Read",
                  "Skill",
                  "mcp__github_inline_comment__create_inline_comment"
                ]
              }
            }
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
