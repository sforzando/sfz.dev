# Source code spell checker
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
  # Congo theme is a submodule; its spelling is not ours to fix.
  "themes/",
  # Faker.js fills dummy content with Latin lorem ipsum, which typos reads as
  # misspelled English (utilis, solum, aer, ...).
  "content/**/dummy_*",
  # Generated by git-cliff from commit subjects, so a typo here cannot be fixed
  # in place without rewriting history.
  "CHANGELOG.md",
]

# ignore-hidden is deliberately left at its default of true. Turning it off
# makes typos read the zlib blobs under .git/objects as text, which
# --write-changes would then happily corrupt.

[default]
# Without this, typos treats every English dialect as valid and lets UK
# spellings through. Forcing US spelling is the whole point of adopting it.
locale = "en-us"
extend-ignore-re = [
  # Escape hatch for prose that has to quote a misspelling to explain it, such
  # as the docs describing what this very tool rejects. Markdown and HTML have
  # no line comment, so the marker is an HTML comment at end of line:
  #   ... rejects `colour` <!-- spellchecker:disable-line -->
  "(?Rm)^.*<!--\\s*spellchecker:disable-line\\s*-->$",
]
