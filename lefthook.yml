# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  commands:
    hide:
      run: |
        task gs:hide
        git add '*.secret' .gitsecret/paths/mapping.cfg

    # No glob: a typo can live in any text file, and a whole-repo scan takes
    # about 50ms. Lefthook runs commands without a priority last, so without an
    # explicit priority this would land after format; a rewritten word can
    # shorten a line enough for Prettier to want to rejoin it, so spelling has
    # to settle before the formatters get their turn.
    lint:typos:
      priority: 1
      run: task lint:typos
      stage_fixed: true

    format:
      glob: "*.{js,ts,json,css,html}"
      run: task format
      stage_fixed: true

    lint:markdown:
      glob: "*.md"
      run: task lint:markdown
      stage_fixed: true

    test:
      run: task test:headless

    # Sort Claude settings
    sort-settings:
      glob: ".claude/settings.local.json"
      run: |
        if [ -f .claude/settings.local.json ]; then
          jq --indent 2 '.permissions.allow |= sort' .claude/settings.local.json > .claude/.temp.$$.json && \
          mv .claude/.temp.$$.json .claude/settings.local.json
        fi
      stage_fixed: true

pre-push:
  commands:
    lighthouse:
      run: task lighthouse
