[build]
  command = "hugo --gc --minify --baseURL $URL"
  publish = "public"

[build.environment]
  NODE_ENV = "development"
  GO_VERSION = "1.26.5"
  # Single source of truth: inherited by production, deploy-preview, and branch-deploy.
  # Defining it per-context previously left branch-deploy on Netlify's default Hugo.
  HUGO_VERSION = "0.164.0"
  TZ = "Asia/Tokyo"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[[redirects]]
  from = "https://sforzando.co.jp"
  to = "https://sfz.dev"
  status = 301
  force = true

[[redirects]]
  from = "https://sforzando.net"
  to = "https://sfz.dev"
  status = 301
  force = true
